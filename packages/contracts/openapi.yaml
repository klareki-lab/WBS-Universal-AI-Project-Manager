openapi: 3.1.0
info:
  title: Universal AI Project Manager Backend
  version: 1.1.0
  description: Canonical v1 contract. Mutations require Idempotency-Key. Cookie
    writes also require X-CSRF-Token. Human approval binds immutable content
    hash; services cannot approve. Task metadata PATCH returns a draft plan
    requiring approval and publication. Lists use limit/offset. HTTP errors
    contain stable request_id.
servers:
  - url: http://localhost:13081
paths:
  /api/v1/projects:
    post:
      operationId: createProject
      summary: Create an owned project
      tags:
        - Core
      security:
        - cookieAuth: []
      parameters:
        - name: Idempotency-Key
          in: header
          required: true
          schema:
            type: string
            minLength: 8
            maxLength: 200
            pattern: ^[A-Za-z0-9_.:-]+$
        - name: X-CSRF-Token
          in: header
          required: false
          description: Mandatory with cookie authentication on mutations; obtain from login.
          schema:
            type: string
      x-service-scope: projects:write
      x-required-service-scopes:
        - projects:write
      x-human-only: true
      responses:
        "201":
          description: Success
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/createProjectResponse"
        "400":
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Unauthenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: Forbidden or CSRF failure
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Resource unavailable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: State/version/idempotency conflict
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "413":
          description: Request failure
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "415":
          description: Request failure
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "429":
          description: Request failure
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          description: Request failure
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "503":
          description: Request failure
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/createProjectRequest"
    get:
      operationId: listProjects
      summary: List accessible projects
      tags:
        - Core
      security:
        - cookieAuth: []
        - serviceBearer: []
      parameters:
        - name: limit
          in: query
          required: false
          schema:
            default: 50
            type: integer
            minimum: 1
            maximum: 100
        - name: offset
          in: query
          required: false
          schema:
            default: 0
            type: integer
            minimum: 0
            maximum: 100000
      x-service-scope: read
      x-required-service-scopes:
        - read
      x-human-only: false
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/listProjectsResponse"
        "400":
          description: Invalid input
          content:
            application/json:
