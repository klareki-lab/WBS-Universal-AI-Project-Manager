components:
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: uapm_session
    serviceBearer:
      type: http
      scheme: bearer
      description: 90-day service token, stored hashed; explicit project membership
        and endpoint scope required.
  schemas:
    Error:
      type: object
      properties:
        error:
          type: object
          properties:
            code:
              type: string
              pattern: ^[^\u0000\uD800-\uDFFF]*$
            message:
              type: string
              pattern: ^[^\u0000\uD800-\uDFFF]*$
            request_id:
              type: string
              pattern: ^[^\u0000\uD800-\uDFFF]*$
          required:
            - code
            - message
            - request_id
          additionalProperties: false
      required:
        - error
      additionalProperties: false
    User:
      type: object
      properties:
        id:
          type: string
          format: uuid
          pattern: ^([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-8][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}|00000000-0000-0000-0000-000000000000|ffffffff-ffff-ffff-ffff-ffffffffffff)$
